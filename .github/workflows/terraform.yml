name: "Terraform All Branches"
on:
  pull_request:
    branches:
      - "*"
      - "*/*"
      - "**"

jobs:
  fast-checks:
    uses: ./.github/workflows/fast_checks.yml
  terraform-format-test:
    uses: ./.github/workflows/terraform_format.yml
  tfsec-pr-commenter:
    uses: ./.github/workflows/tfsec_pr_commenter.yml
